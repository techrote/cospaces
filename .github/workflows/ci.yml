name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply exact-bundle validation fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cospaces/services/evidence_service.py")
          text = path.read_text()
          old = '''        actual_files: set[str] = set()\n        files_dir = bundle / "files"\n        if files_dir.exists():\n            for child in files_dir.rglob("*"):\n                if child.is_symlink():\n                    return self._validation_failure("Evidence bundle contains a symlink")\n                if child.is_file():\n                    actual_files.add(child.relative_to(bundle).as_posix())\n        if actual_files != expected_files:\n            return self._validation_failure("Evidence bundle contains missing or unexpected files")\n'''
          new = '''        actual_files: set[str] = set()\n        for child in bundle.rglob("*"):\n            if child.is_symlink():\n                return self._validation_failure("Evidence bundle contains a symlink")\n            if not child.is_file() or child == manifest_path:\n                continue\n            actual_files.add(child.relative_to(bundle).as_posix())\n        if actual_files != expected_files:\n            return self._validation_failure("Evidence bundle contains missing or unexpected files")\n'''
          if old not in text:
              raise SystemExit("expected validator block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          python -m ruff format src/cospaces/services/evidence_service.py
      - name: Commit self-fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cospaces/services/evidence_service.py
          git commit -m "Validate exact T7 bundle file set"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/cospaces
      - name: Unit tests
        run: python -m pytest
      - name: Phase 1 hardening suite
        run: python tools/hardening_smoke.py --json
      - name: External workload smoke
        run: python tools/external_workload.py --profile smoke --json
      - name: Live harness import smoke
        run: python tools/live_codespace_smoke.py --help
      - name: Build package
        run: python -m build
      - name: Module CLI smoke
        run: python -m cospaces --help
      - name: Console CLI smoke
        run: cospaces --help
