name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format diff
        run: python -m ruff format --diff .
      - name: Type check
        run: python -m mypy src/cospaces
      - name: Unit tests
        run: python -m pytest
      - name: Phase 1 hardening suite
        run: python tools/hardening_smoke.py --json
      - name: External workload smoke
        run: python tools/external_workload.py --profile smoke --json
      - name: Live harness import smoke
        run: python tools/live_codespace_smoke.py --help
      - name: Build package
        run: python -m build
      - name: Module CLI smoke
        run: python -m cospaces --help
      - name: Console CLI smoke
        run: cospaces --help
